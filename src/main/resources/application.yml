server:
  port: 8090

spring:
  application:
    name: mcp-forge

  datasource:
    url: jdbc:h2:file:./data/mcp-forge;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    mcp:
      server:
        name: mcp-forge
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
    ollama:
      base-url: http://localhost:11435
      chat:
        options:
          model: hermes3
          temperature: 0.1
          num-ctx: 4096

mcp-forge:
  ratelimit:
    capacity: 10
    refill-tokens: 10
    refill-period-seconds: 60
  audit:
    redact-fields:
      - password
      - token
      - secret
      - apiKey

logging:
  level:
    it.forpiller.mcpforge: DEBUG
