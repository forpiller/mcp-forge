<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="styles">
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="stylesheet" th:href="@{/css/global.css}">
</th:block>
</head>
<body>
<th:block th:fragment="topbar(active)">
<div class="topbar">
    <div>
        <h1>MCP-FORGE</h1>
        <p class="subtitle" th:text="#{app.subtitle}">Registra una fonte API e genera automaticamente i suoi tool MCP.</p>
    </div>
    <nav class="topnav">
        <a href="/" th:classappend="${active == 'home'} ? ' active'" th:text="#{nav.home}">Home</a>
        <a href="/fonti" th:classappend="${active == 'fonti'} ? ' active'" th:text="#{nav.fonti}">Fonti</a>
        <a href="/log" th:classappend="${active == 'log'} ? ' active'" th:text="#{nav.log}">Log</a>
        <a href="/connetti" th:classappend="${active == 'connetti'} ? ' active'" th:text="#{nav.connetti}">Connetti</a>
        <a href="/chat" th:classappend="${active == 'chat'} ? ' active'" th:text="#{nav.chat}">Chat</a>
        <a href="/ports" th:classappend="${active == 'ports'} ? ' active'" th:text="#{nav.servizi}">Servizi</a>
        <div class="lang-switcher">
            <a href="?lang=it" class="lang-btn" th:classappend="${#locale.language == 'it'} ? ' active'">IT</a>
            <a href="?lang=en" class="lang-btn" th:classappend="${#locale.language == 'en'} ? ' active'">EN</a>
        </div>
    </nav>
</div>
</th:block>

<th:block th:fragment="confirmModal">
<div class="modal-overlay" id="confirmModalOverlay">
    <div class="modal-box" role="alertdialog" aria-modal="true">
        <h3 id="confirmModalTitle" th:text="#{modal.confirm}">Conferma</h3>
        <p id="confirmModalMessage"></p>
        <div class="modal-actions">
            <button type="button" class="btn-secondary" id="confirmModalCancel" th:text="#{modal.cancel}">Annulla</button>
            <button type="button" class="btn-danger" id="confirmModalOk" th:text="#{modal.confirm}">Conferma</button>
        </div>
    </div>
</div>
</th:block>


<th:block th:fragment="scripts">
<script th:src="@{/js/global.js}"></script>
</th:block>

</body>
</html>
